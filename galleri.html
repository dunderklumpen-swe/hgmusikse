</nav></div></header>
<main>

<section class="page-title"><div class="wrap"><span class="eyebrow">Galleri</span><h1>Från scenen</h1><p>Klicka på en bild för att förstora.</p></div></section>
<section class="block" style="padding-top:2rem"><div class="wrap"><div class="gallery"><a href="assets/images/galleri-5.jpg"><img src="assets/images/galleri-5.jpg" alt="HGs på scen med keyboard och gitarr" loading="lazy"></a><a href="assets/images/galleri-1.jpg"><img src="assets/images/galleri-1.jpg" alt="Duon i julskjortor" loading="lazy"></a><a href="assets/images/galleri-3.jpg"><img src="assets/images/galleri-3.jpg" alt="Gustaf vid pianot" loading="lazy"></a><a href="assets/images/galleri-4.jpg"><img src="assets/images/galleri-4.jpg" alt="Henrik sjunger och spelar gitarr" loading="lazy"></a><a href="assets/images/galleri-2.jpg"><img src="assets/images/galleri-2.jpg" alt="Spelning i julskjortor" loading="lazy"></a></div></div></section>
<section class="block" style="padding-top:0"><div class="wrap">
<span class="eyebrow">Instagram</span>
<h2>Senaste från Instagram</h2>
<!-- INSTAGRAM-FLÖDE: klistra in embed-koden från er flödestjänst (t.ex. Behold, Elfsight, SnapWidget eller Curator.io) inuti diven nedan, i stället för platshållartexten. -->
<div id="instagram-feed" class="insta"><p style="margin:0">Instagram-flödet visas här när det är kopplat.</p></div>
</div></section>
<div class="lb" id="lb"><img alt=""></div>
<script>
const lb=document.getElementById('lb'),li=lb.querySelector('img');
document.querySelectorAll('.gallery a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();li.src=a.href;li.alt=a.querySelector('img').alt;lb.classList.add('on')}));
lb.addEventListener('click',()=>lb.classList.remove('on'));
addEventListener('keydown',e=>{if(e.key==='Escape')lb.classList.remove('on')});
</script>
</main>
<footer class="site-footer"><div class="wrap">

<script>
/* Kontaktuppgifter skrivs ut som vanlig text (ej länkar) via JS för att minska spam. */
document.querySelectorAll('[data-m]').forEach(function(e){{e.textContent=['info','hgmusik.se'].join('@')}});
document.querySelectorAll('[data-t]').forEach(function(e){{e.textContent=['076','367 58 10'].join('-')}});
</script>
