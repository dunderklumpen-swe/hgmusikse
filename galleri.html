</head>
<body>
<header class="site-header"><div class="wrap">
<a class="brand" href="/"><img src="assets/images/logo-avlang.png" alt="HGs – Sveriges närmsta coverband (från Ystad räknat)"></a>
<button class="burger" aria-label="Meny" onclick="document.getElementById('nav').classList.toggle('open')">☰</button>
<nav class="nav" id="nav">
<a href="/">Hem</a><a href="om-oss">Om oss</a><a href="galleri" aria-current="page">Galleri</a><a href="spelningar">Spelningar</a><a href="kontakt">Kontakt</a>
<a class="fb" href="https://www.facebook.com/profile.php?id=61587893577133" target="_blank" rel="noopener" aria-label="HGs på Facebook"><svg viewBox="0 0 24 24"><path d="M13.5 22v-8.2h2.8l.5-3.3h-3.3V8.4c0-.9.4-1.7 1.8-1.7h1.6V3.8s-1.4-.3-2.8-.3c-2.8 0-4.5 1.7-4.5 4.7v2.3H6.7v3.3h2.9V22z"/></svg></a>
</nav></div></header>
<main>

<section class="page-title"><div class="wrap"><h1>Galleri</h1><p>Det senaste från Instagram och foton från våra spelningar.</p></div></section>
<section class="block" id="insta-section" style="padding:0;height:0;overflow:hidden"><div class="wrap">
<h2>Senaste från Instagram</h2>
<!-- Instagram-flöde via Behold. Sektionen visas först när flödet har innehåll. -->
<div id="instagram-feed" style="margin-top:1.5rem"><behold-widget feed-id="F9cFCOzjSP9YoluSex19"></behold-widget></div>
<script>
  (() => {
    if(window.__bhldScript)return;window.__bhldScript=true;
    const d=document,s=d.createElement("script");s.type="module";
    s.src="https://w.behold.so/widget.js";setTimeout(()=>{d.head.append(s);},0);
  })();
  (function(){var n=0,t=setInterval(function(){var w=document.querySelector('behold-widget');
    if(w&&w.offsetHeight>80){var s=document.getElementById('insta-section');s.style.cssText='padding:1rem 0 0';clearInterval(t)}
    else if(++n>40)clearInterval(t)},250)})();
</script>
</div></section>
<section class="block" style="padding:3rem 0 0"><div class="wrap">
<h2>Från spelningarna</h2>
<p class="muted" style="margin-bottom:1.5rem">Klicka på en bild för att förstora.</p>
<div class="gallery"><a href="assets/images/galleri-5.jpg"><img src="assets/images/galleri-5.jpg" alt="HGs på scen med keyboard och gitarr" loading="lazy"></a><a href="assets/images/galleri-1.jpg"><img src="assets/images/galleri-1.jpg" alt="Duon i julskjortor" loading="lazy"></a><a href="assets/images/galleri-3.jpg"><img src="assets/images/galleri-3.jpg" alt="Gustaf vid pianot" loading="lazy"></a><a href="assets/images/galleri-4.jpg"><img src="assets/images/galleri-4.jpg" alt="Henrik sjunger och spelar gitarr" loading="lazy"></a><a href="assets/images/galleri-2.jpg"><img src="assets/images/galleri-2.jpg" alt="Spelning i julskjortor" loading="lazy"></a></div></div></section>
<div class="lb" id="lb"><img alt=""></div>
<script>
const lb=document.getElementById('lb'),li=lb.querySelector('img');
document.querySelectorAll('.gallery a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();li.src=a.href;li.alt=a.querySelector('img').alt;lb.classList.add('on')}));
lb.addEventListener('click',()=>lb.classList.remove('on'));
addEventListener('keydown',e=>{if(e.key==='Escape')lb.classList.remove('on')});
</script>
</main>
<footer class="site-footer"><div class="wrap">
<div>© 2026 HGs · <a href="spelningar">Spelningar</a> · <a href="kontakt">Kontakt</a></div>
</div></footer>
<script>
/* Kontaktuppgifter skrivs ut som vanlig text (ej länkar) via JS för att minska spam. */
document.querySelectorAll('[data-m]').forEach(function(e){{e.textContent=['info','hgmusik.se'].join('@')}});
document.querySelectorAll('[data-t]').forEach(function(e){{e.textContent=['076','367 58 10'].join('-')}});
</script>
</body></html>
